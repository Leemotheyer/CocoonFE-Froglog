name: Froglog source import check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: CocoonFE tag (e.g. beta-3.0)
        required: true
        default: beta-3.0
  schedule:
    - cron: '0 12 * * 1'

jobs:
  probe-tag-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Try import from tag archive
        env:
          TAG: ${{ github.event.inputs.tag || 'beta-3.0' }}
          SOURCE_MODE: auto
        run: |
          set -euo pipefail
          echo "Tag archive: https://github.com/inssekt/CocoonFE/archive/refs/tags/${TAG}.zip"
          if ./scripts/import-cocoon-source-from-release.sh; then
            echo "Source import succeeded."
          else
            code=$?
            if [[ "$code" -eq 4 ]]; then
              echo "::notice::Tag archive has no Gradle project yet (platforms-only snapshot or Android not in repo at this tag)."
              exit 0
            fi
            exit "$code"
          fi

      - name: Verify Gradle root after import
        if: success() && hashFiles('android/settings.gradle.kts', 'android/settings.gradle') != ''
        run: |
          test -f android/SOURCE_VERSION
          cat android/SOURCE_VERSION
