name: Build Cocoon Froglog APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'cursor/**'
      - 'main'
    paths:
      - 'android/froglog-core/**'
      - 'scripts/**'
      - '.github/workflows/build-cocoon-froglog-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install apktool
        run: |
          curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          echo '#!/bin/sh' | sudo tee /usr/local/bin/apktool
          echo 'exec java -jar /tmp/apktool.jar "$@"' | sudo tee -a /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool

      - name: Build merged APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-froglog-apk.sh

      - name: Verify APK (smali baselines + dex)
        run: |
          python3 scripts/verify-froglog-built-apk.py android/dist/cocoon-froglog.apk android/apktool-cocoon

      - uses: actions/upload-artifact@v4
        with:
          name: cocoon-froglog-apk
          path: |
            android/dist/cocoon-froglog.apk
            android/dist/cocoon-froglog-*-alpha.apk
          retention-days: 14

  smoke-emulator:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cocoon-froglog-apk
          path: android/dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Emulator smoke test (ART VerifyError)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          script: |
            chmod +x scripts/smoke-test-froglog-apk.sh
            export FROGLOG_SMOKE_REQUIRED=1
            export FROGLOG_SMOKE_WAIT_SEC=30
            ./scripts/smoke-test-froglog-apk.sh android/dist/cocoon-froglog.apk
